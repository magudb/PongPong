[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="*.lua,*.csv,*.json,*.map,*.txt,*.ps1,*.sh"
exclude_filter="docs/*,tests/*,tools/*,legacy/*,.github/*,build/*,dist/*,assets/audio/voice/_user_recordings_v0/*,assets/art_studies/*,scenes/ui/dev/*,scripts/ui/dev/ui_smoke.gd,scenes/ui/cheat_menu.tscn,scripts/ui/testing/*,scripts/dungeon/gen/dungeon_verify.gd,*.blend,*.npz"
export_path="build/windows/Traetoppen/Traetoppen.exe"
script_export_mode=0

[preset.0.options]
custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/product_name="Traetoppen"
application/company_name="magudb"
application/file_description="Trætoppen"
application/file_version="0.0.0.0"
application/product_version="0.0.0.0"
codesign/enable=false
debug/export_console_wrapper=0

[preset.1]
name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter="*.lua,*.csv,*.json,*.map,*.txt,*.ps1,*.sh"
exclude_filter="docs/*,tests/*,tools/*,legacy/*,.github/*,build/*,dist/*,assets/audio/voice/_user_recordings_v0/*,assets/art_studies/*,scenes/ui/dev/*,scripts/ui/dev/ui_smoke.gd,scenes/ui/cheat_menu.tscn,scripts/ui/testing/*,scripts/dungeon/gen/dungeon_verify.gd,*.blend,*.npz"
export_path="build/macos/Traetoppen.app"
script_export_mode=0

[preset.1.options]
export/distribution_type=1
binary_format/architecture="universal"
application/bundle_identifier="io.github.magudb.traetoppen"
application/short_version="0.0.0"
application/version="0.0.0"
application/category="Games"
application/min_macos_version_x86_64="10.13"
application/min_macos_version_arm64="11.0"
codesign/codesign=1
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=false
codesign/entitlements/app_sandbox/enabled=false
codesign/entitlements/debugging=false
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
