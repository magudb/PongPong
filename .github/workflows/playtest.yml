name: playtest

# Headless gate for every push and PR. `main` is expected to stay green
# (docs/DEVELOPMENT.md); this workflow is what enforces that on GitHub.
#
# tests/run_playtest.sh already has a CI-ready contract:
#   exit 0 = PASS, 1 = failed checks / engine errors or warnings,
#   2 = usage or infrastructure, 124 = timeout.
# --strict ignores tests/lib/known_issues.txt so tolerated warnings cannot pile up here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playtest:
    name: headless harness (${{ matrix.character }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        character: [animal, fairy, hobbit, ghost]

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Release and updater tooling tests
        run: python -m unittest discover -s tools/release/tests -v

      - name: Validate localization
        run: python tools/loc/csv_lint.py --strict --quiet

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.godot-bin
          key: godot-linux-${{ hashFiles('tools/ci/godot.json') }}

      - name: Install checksum-pinned Godot
        run: python tools/ci/install_godot.py

      - name: Import project
        # Fresh runners have no .godot cache; the harness would import anyway, but doing it
        # here surfaces import errors as their own step and warms the cache for the run.
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --import

      - name: Run playtest (strict)
        run: |
          set -euo pipefail
          tests/run_playtest.sh --strict --timeout=2400 --character=${{ matrix.character }} --report=/tmp/playtest-${{ matrix.character }}.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playtest-report-${{ matrix.character }}
          path: /tmp/playtest-${{ matrix.character }}.json
          if-no-files-found: ignore
