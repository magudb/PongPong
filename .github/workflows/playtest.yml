name: playtest

# Headless gate for every push and PR. `main` is expected to stay green
# (docs/DEVELOPMENT.md); this workflow is what enforces that on GitHub.
#
# tests/run_playtest.sh already has a CI-ready contract:
#   exit 0 = PASS, 1 = failed checks / engine errors or warnings,
#   2 = usage or infrastructure, 124 = timeout.
# --strict ignores tests/lib/known_issues.txt so tolerated warnings cannot pile up here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playtest:
    name: headless harness (${{ matrix.character }}, part ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        character: [animal, fairy, hobbit, ghost]
        shard: [0, 1, 2, 3]

    env:
      PYTHONUNBUFFERED: "1"
      TT_PERF_SCALE: "4"
      LIBGL_ALWAYS_SOFTWARE: "1"
      VTK_DEFAULT_OPENGL_WINDOW: vtkXOpenGLRenderWindow

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Media under docs/ and tools/art/ goes into Git LFS from now on (docs/DEVELOPMENT.md, "Repository size"), and
      # some art sections read review sheets and source paintings there. QA screenshots (docs/qa, docs/review) are
      # never read by a test and are not downloaded. The rest comes from a cache keyed by the object ids, so 16 jobs
      # do not each spend LFS bandwidth; with no such LFS file in the tree both steps are skipped.
      - name: List Git LFS objects
        id: lfs
        env:
          LFS_EXCLUDE: docs/qa/**,docs/review/**
        run: |
          set -euo pipefail
          git lfs ls-files --long --exclude="$LFS_EXCLUDE" | cut -d ' ' -f1 | sort > "$RUNNER_TEMP/lfs-objects.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/lfs-objects.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "key=lfs-$(sha256sum "$RUNNER_TEMP/lfs-objects.txt" | cut -c1-32)" >> "$GITHUB_OUTPUT"
          echo "exclude=$LFS_EXCLUDE" >> "$GITHUB_OUTPUT"

      - name: Cache Git LFS objects
        if: steps.lfs.outputs.count != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: lfs-

      - name: Check out Git LFS files
        if: steps.lfs.outputs.count != '0'
        run: git lfs install --local && git lfs pull --exclude="${{ steps.lfs.outputs.exclude }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/art/core/requirements.txt

      - name: Install Lua 5.4 for independent data checks
        run: sudo apt-get update -qq && sudo apt-get install --no-install-recommends -y lua5.4 xvfb libgl1-mesa-dri

      - name: Install pinned test and art tooling
        run: tools/art/setup_env.sh

      - name: Verify portable image comparisons
        run: tools/art/.venv/bin/python tools/ui/test_crop_guide_refs.py

      - name: Release and updater tooling tests
        run: python -m unittest discover -s tools/release/tests -v

      - name: Validate localization
        run: python tools/loc/csv_lint.py --strict --quiet

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.godot-bin
          key: godot-linux-${{ hashFiles('tools/ci/godot.json') }}

      - name: Install checksum-pinned Godot
        run: python tools/ci/install_godot.py

      - name: Import project
        # Fresh runners have no .godot cache; the harness would import anyway, but doing it
        # here surfaces import errors as their own step and warms the cache for the run.
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --import
          "$GODOT" --headless --path . --import

      - name: Run playtest (strict)
        run: |
          set -euo pipefail
          sections="$(python tools/ci/sections.py --shard ${{ matrix.shard }} --count 4 --pace normal)"
          xvfb-run -a tests/run_playtest.sh --strict --timeout=2700 --only="$sections" --character=${{ matrix.character }} --report=/tmp/playtest-${{ matrix.character }}-${{ matrix.shard }}.json

      - name: Run seeded combat simulations at fixed physics steps
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          sections="$(python tools/ci/sections.py --shard ${{ matrix.shard }} --count 4 --pace simulation)"
          if [[ -n "$sections" ]]; then
            xvfb-run -a tests/run_playtest.sh --strict --fast --timeout=1800 --only="$sections" --character=${{ matrix.character }} --report=/tmp/playtest-${{ matrix.character }}-${{ matrix.shard }}-simulation.json
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playtest-report-${{ matrix.character }}-${{ matrix.shard }}
          path: /tmp/playtest-${{ matrix.character }}-${{ matrix.shard }}*.json
          if-no-files-found: ignore
