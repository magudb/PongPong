name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: "0.0.0"
      production:
        type: boolean
        default: false
    outputs:
      windows:
        description: SHA-256 of each Windows package, as recorded by its build job
        value: ${{ jobs.export.outputs.windows }}
      macos:
        description: SHA-256 of each macOS package, as recorded by its build job
        value: ${{ jobs.export.outputs.macos }}
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export and run ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    # Each platform sets only its own output, so the matrix keeps both.
    outputs:
      windows: ${{ steps.digests.outputs.windows }}
      macos: ${{ steps.digests.outputs.macos }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.0.0' }}
      RELEASE_PRODUCTION: ${{ inputs.production || false }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache verified toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot-bin
          key: godot-export-${{ runner.os }}-${{ hashFiles('tools/ci/godot.json', 'tools/ci/nsis.json') }}
      - name: Install Godot and desktop templates
        run: python tools/ci/install_godot.py --templates
      - name: Install checksum-pinned NSIS compiler
        if: matrix.platform == 'windows'
        run: python tools/ci/install_nsis.py
      - name: Test release tools and native update installer
        run: python -m unittest discover -s tools/release/tests -v
      - name: Export, install and smoke-test the packaged game
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          MACOS_CERTIFICATE_P12: ${{ inputs.production && secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.production && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.production && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.production && secrets.APPLE_ID || '' }}
          APPLE_APP_PASSWORD: ${{ inputs.production && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.production && secrets.APPLE_TEAM_ID || '' }}
        run: |
          production=()
          if [[ "$RELEASE_PRODUCTION" == true ]]; then production+=(--production); fi
          python tools/release/release.py build --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY" --smoke "${production[@]}"
      - name: Report package digests to the publish job
        id: digests
        run: python tools/release/release.py digests --platform "${{ matrix.platform }}" --version "$RELEASE_VERSION"
      - name: Upload native installer, update payload and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-v${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
