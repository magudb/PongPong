name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: "0.0.0"
      production:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  export:
    name: Export and run ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.0.0' }}
      RELEASE_PRODUCTION: ${{ inputs.production || false }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache verified toolchain downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .godot-bin
          key: godot-export-${{ runner.os }}-${{ hashFiles('tools/ci/godot.json') }}
      - name: Install Godot and desktop templates
        run: python tools/ci/install_godot.py --templates
      - name: Test release tools and native update installer
        run: python -m unittest discover -s tools/release/tests -v
      - name: Export and smoke-test the packaged game
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          MACOS_CERTIFICATE_P12: ${{ inputs.production && secrets.MACOS_CERTIFICATE_P12 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.production && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.production && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.production && secrets.APPLE_ID || '' }}
          APPLE_APP_PASSWORD: ${{ inputs.production && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.production && secrets.APPLE_TEAM_ID || '' }}
        run: |
          production=()
          if [[ "$RELEASE_PRODUCTION" == true ]]; then production+=(--production); fi
          python tools/release/release.py build --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY" --smoke "${production[@]}"
      - name: Upload installable package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}-v${{ env.RELEASE_VERSION }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
