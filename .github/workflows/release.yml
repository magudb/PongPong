name: Production release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Commit history only: enough to prove the tag is on main without the art blobs.
          fetch-depth: 0
          filter: blob:none
      - name: Require a strict vX.Y.Z production tag on main
        id: metadata
        run: python3 tools/release/release.py metadata --require-on origin/main

  tests:
    needs: version
    uses: ./.github/workflows/playtest.yml

  builds:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      production: true
    # Only the signing and notarization credentials, never every repository secret.
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [version, tests, builds]
    runs-on: ubuntu-latest
    # Required reviewers on the "release" environment hold publishing until a person approves it.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*-v${{ needs.version.outputs.version }}
          path: dist
          merge-multiple: true
      - name: Publish both platforms together after every check passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f "dist/Traetoppen-${RELEASE_TAG}-windows.zip"
          test -f "dist/Traetoppen-${RELEASE_TAG}-macos.zip"
          test -f "dist/Traetoppen-${RELEASE_TAG}-windows-setup.exe"
          test -f "dist/Traetoppen-${RELEASE_TAG}-macos.dmg"
          cd dist
          sha256sum --check ./*.sha256
          cat ./*.sha256 > SHA256SUMS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          mac = json.loads(Path(f'Traetoppen-{os.environ["RELEASE_TAG"]}-macos.dmg.json').read_text())
          notes = [
              "Download the installer for your platform from Assets below.",
              "",
              "- **Windows x86_64:** run `Traetoppen-" + os.environ["RELEASE_TAG"] + "-windows-setup.exe`. Setup installs for your account, adds a Start menu shortcut and an Apps & Features uninstall entry. A desktop shortcut is optional.",
              "- **macOS Intel / Apple Silicon:** open `Traetoppen-" + os.environ["RELEASE_TAG"] + "-macos.dmg`, drag Traetoppen.app to Applications, then eject the disk image. For a personal installation, use ~/Applications.",
              "- **Updates:** Settings → Updates downloads and installs newer releases after confirmation. Saves are preserved.",
              "",
              "The ZIP files are update payloads and remain available for existing portable installations.",
              "",
          ]
          if not mac["signed_and_notarized"]:
              notes += ["The macOS build is ad-hoc signed and **not notarized**. See the [macOS installation guidance](https://docs.godotengine.org/en/stable/tutorials/export/running_on_macos.html) if macOS blocks its first launch.", ""]
          Path("RELEASE_NOTES.txt").write_text("\n".join(notes), encoding="utf-8")
          PY
          gh release create "$RELEASE_TAG" ./*.exe ./*.dmg ./*.zip ./*.json SHA256SUMS --verify-tag --latest --generate-notes --notes-file RELEASE_NOTES.txt --title "Trætoppen $RELEASE_TAG"
