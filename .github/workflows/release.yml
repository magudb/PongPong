name: Production release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit history to prove the tag is on main. The blob filter skips the files of older commits and the
          # sparse checkout limits the tagged tree to the release tooling, so the art is never downloaded.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools/release
      - name: Require a strict vX.Y.Z production tag on main
        id: metadata
        run: python3 tools/release/release.py metadata --require-on origin/main

  tests:
    needs: version
    uses: ./.github/workflows/playtest.yml

  builds:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      production: true
    # Only the signing and notarization credentials, never every repository secret.
    secrets:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [version, tests, builds]
    runs-on: ubuntu-latest
    # Required reviewers on the "release" environment hold publishing until a person approves it.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exact artifact names: nothing else uploaded in this run can be merged into the release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-v${{ needs.version.outputs.version }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-v${{ needs.version.outputs.version }}
          path: dist
      - name: Check every package against the digest its build job reported
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WINDOWS_DIGESTS: ${{ needs.builds.outputs.windows }}
          MACOS_DIGESTS: ${{ needs.builds.outputs.macos }}
        run: |
          set -euo pipefail
          python3 tools/release/release.py verify-publish --tag "$RELEASE_TAG" --dir dist --digests "$WINDOWS_DIGESTS" --digests "$MACOS_DIGESTS"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish both platforms together after every check passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          WINDOWS_DIGESTS: ${{ needs.builds.outputs.windows }}
          MACOS_DIGESTS: ${{ needs.builds.outputs.macos }}
        run: |
          set -euo pipefail
          python3 tools/release/publish_release.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --dir dist --digests "$WINDOWS_DIGESTS" --digests "$MACOS_DIGESTS"
